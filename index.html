<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function () {
        // Safe global error & rejection suppression for harmless dev-server HMR websocket closed notices
        window.addEventListener('error', function (event) {
          var msg = event && (event.message || (event.error && event.error.message) || '');
          if (msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (typeof reason === 'string') ? reason : (reason && (reason.message || reason.stack) ? (reason.message || reason.stack) : '');
          if (msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Filter benign Vite websocket disconnection logs from developer console
        try {
          var origError = console.error;
          var origWarn = console.warn;
          var origDebug = console.debug;
          var origLog = console.log;
          var origInfo = console.info;
          function shouldFilter(args) {
            if (!args || !args.length) return false;
            var str = '';
            for (var i = 0; i < args.length; i++) {
              var a = args[i];
              if (typeof a === 'string') {
                str += a + ' ';
              } else if (a && (a.message || a.stack)) {
                str += (a.message || a.stack) + ' ';
              } else if (a) {
                try { str += JSON.stringify(a) + ' '; } catch (e) {}
              }
            }
            var s = str.toLowerCase();
            return s.indexOf('[vite]') !== -1 ||
                   s.indexOf('websocket') !== -1 ||
                   s.indexOf('failed to connect to websocket') !== -1 ||
                   s.indexOf('closed without opened') !== -1;
          }
          console.error = function () {
            if (shouldFilter(arguments)) return;
            origError.apply(console, arguments);
          };
          console.warn = function () {
            if (shouldFilter(arguments)) return;
            origWarn.apply(console, arguments);
          };
          console.debug = function () {
            if (shouldFilter(arguments)) return;
            origDebug.apply(console, arguments);
          };
          console.log = function () {
            if (shouldFilter(arguments)) return;
            origLog.apply(console, arguments);
          };
          console.info = function () {
            if (shouldFilter(arguments)) return;
            origInfo.apply(console, arguments);
          };
        } catch (eConsole) {}

        // Immediate theme initialization to prevent flash
        try {
          var savedTheme = localStorage.getItem('fuelflow_v1_theme');
          var isLight = savedTheme === 'light';
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>FuelNest - Fleet Fuel Intelligence</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.ico" />
    <meta name="description" content="Enterprise fleet fuel tracking, pump credit ledger, internal bowzer inventory, mileage anomaly detection, and analytical reporting system for fuelnest.xyz." />
    <meta property="og:title" content="FuelNest - Fleet Fuel Intelligence" />
    <meta property="og:description" content="Enterprise fleet fuel tracking, pump credit ledger, internal bowzer inventory, mileage anomaly detection, and analytical reporting system for fuelnest.xyz." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
