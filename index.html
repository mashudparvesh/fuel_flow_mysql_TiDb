    <script>
      (function () {
        try {
          var _origFetch = window.fetch;
          var currentFetch = typeof _origFetch === 'function' ? _origFetch.bind(window) : _origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e2) {}
          }
        } catch (e) {}

        window.addEventListener('error', function (event) {
          var msg = event && (event.message || (event.error && event.error.message) || '');
          if (msg && (
            (msg.indexOf('fetch') !== -1 && msg.indexOf('getter') !== -1) ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (typeof reason === 'string') ? reason : (reason && (reason.message || reason.stack) ? (reason.message || reason.stack) : '');
          if (msg && (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          )) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        try {
          var savedTheme = localStorage.getItem('fuelflow_v1_theme');
          // Default is 'dark', only switch to light if explicitly saved as 'light'
          var isLight = savedTheme === 'light';
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
