<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142247" />
      <stop offset="100%" stop-color="#060B18" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Icon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#243865" stroke-width="2" />

  <!-- Fuel Droplet & Pump Flame Motif -->
  <g filter="url(#glow)">
    <!-- Droplet Flame Outer -->
    <path d="M32 10 C32 10, 47 28, 47 38 A15 15 0 0 1 17 38 C17 28, 32 10, 32 10 Z" fill="url(#goldGrad)" />
    
    <!-- Inner High-Contrast Deep Spark & Core -->
    <path d="M32 20 C32 20, 41 32, 41 39 A9 9 0 0 1 23 39 C23 32, 32 20, 32 20 Z" fill="#0A1329" />
    
    <!-- Lightning / Fuel Spark inside core -->
    <path d="M33 24 L27 34 L32 34 L31 43 L37 32 L32 32 Z" fill="#FDE047" />
  </g>

  <!-- Golden Ring / Status Accent dot -->
  <circle cx="48" cy="16" r="3.5" fill="#FACC15" stroke="#060B18" stroke-width="1.5" />
</svg>
